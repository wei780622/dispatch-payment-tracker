<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的派工紀錄</title>
<style>
  :root {
    --accent: #0071e3;
    --accent-soft: #eaf3ff;
  }
  body[data-project="HDC"] {
    --accent: #2e8b45;
    --accent-soft: #eaf7ee;
  }

  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f0f1f4;
    margin: 0;
    padding: 24px 16px 48px;
  }

  .topBar { max-width: 900px; margin: 0 auto 12px; }
  .homeBtn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    color: #fff; background: var(--accent); padding: 9px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }
  .homeBtn:active { opacity: 0.85; }

  .card {
    max-width: 900px; margin: 0 auto; background: #fff; border-radius: 16px;
    padding: 4px 24px 28px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07); overflow: hidden;
  }
  .card::before {
    content: ""; display: block; margin: 0 -24px 20px; height: 6px; background: var(--accent);
  }

  h1 { font-size: 20px; margin: 0 0 16px; color: #1d1d1f; }

  .filterBar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 14px 16px; background: #f7f8fa; border-radius: 10px;
  }
  .filterBar label { font-weight: 600; color: #1d1d1f; }
  .filterBar select, .filterBar input[type="month"] {
    padding: 7px 10px; border-radius: 8px; border: 1px solid #d5d5da; font-size: 14px; background: #fff;
  }
  .filterBar select:focus, .filterBar input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #searchBtn {
    border: none; border-radius: 8px; padding: 8px 20px; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #searchBtn:disabled { opacity: 0.6; cursor: default; }

  #emptyState {
    display: none; margin: 28px 0; text-align: center; color: #86868b; font-size: 14px;
  }

  .tableWrap { overflow-x: auto; margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
    padding: 10px 8px; border-bottom: 2px solid var(--accent);
    position: sticky; top: 0;
  }
  tbody td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  tbody tr:hover { background: var(--accent-soft); }
  td:nth-child(7), td:nth-child(8), td:nth-child(9), td:nth-child(10),
  th:nth-child(7), th:nth-child(8), th:nth-child(9), th:nth-child(10) { text-align: right; }
  td:last-child, th:last-child { text-align: center; }

  .row-actions { display: flex; gap: 6px; justify-content: center; }
  .row-actions button {
    border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600;
    border: 1.5px solid; cursor: pointer; background: #fff;
  }
  .editBtn { color: var(--accent); border-color: var(--accent); }
  .editBtn:hover { background: var(--accent-soft); }
  .deleteBtn { color: #d92d20; border-color: #d92d20; }
  .deleteBtn:hover { background: #fdeceb; }

  .edit-form { background: #f7f8fa; padding: 12px 8px; }
  .edit-form label { font-size: 13px; font-weight: 600; margin-right: 4px; }
  .edit-form input {
    width: 90px; padding: 5px 8px; margin-right: 14px; border-radius: 6px; border: 1px solid #d5d5da;
  }
  .saveBtn {
    border: none; border-radius: 8px; padding: 6px 16px; background: var(--accent);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid rgba(0, 0, 0, 0.15); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loadingRow { text-align: center !important; color: #86868b; padding: 20px 8px !important; }
</style>
</head>
<body>
  <div class="topBar">
    <a class="homeBtn" href="index.html">&larr; 回首頁</a>
  </div>
  <div class="card">
    <h1>我的派工紀錄</h1>
    <div class="filterBar">
      <label>姓名</label>
      <select id="engineerSelect"></select>
      <label>月份</label>
      <input type="month" id="monthInput">
      <button id="searchBtn">查詢</button>
    </div>

    <p id="emptyState">這個月查無紀錄</p>

    <div class="tableWrap">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>日期</th><th>DispatchNo</th><th>Project</th><th>角色</th>
            <th>上班</th><th>下班</th><th>加班</th><th>交通</th><th>住宿</th><th>合計</th><th></th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const project = getProjectFromUrl();
    let currentRecords = [];

    document.addEventListener('DOMContentLoaded', init);

    function init() {
      document.body.dataset.project = project;
      const engineerSelect = document.getElementById('engineerSelect');
      setSelectLoading(engineerSelect);
      callApi('getEngineers', { project: project }).then(function (res) {
        clearSelectLoading(engineerSelect);
        (res.engineers || []).forEach(function (name) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          engineerSelect.appendChild(opt);
        });
      });
      const now = new Date();
      document.getElementById('monthInput').value =
        now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById('searchBtn').addEventListener('click', search);
    }

    function search() {
      const name = document.getElementById('engineerSelect').value;
      const yearMonth = document.getElementById('monthInput').value;
      const btn = document.getElementById('searchBtn');
      const restore = setBtnLoading(btn, '查詢中…');
      setTableLoading(document.getElementById('recordsBody'), 11);
      document.getElementById('emptyState').style.display = 'none';
      callApi('getMyRecords', { project: project, name: name, yearMonth: yearMonth }).then(function (res) {
        if (!res.ok) {
          alert('查詢失敗：' + res.error);
          currentRecords = [];
          renderTable();
          return;
        }
        currentRecords = res.records || [];
        renderTable();
      }).catch(function (err) {
        alert('連線異常，請稍後再試一次：' + err.message);
        currentRecords = [];
        renderTable();
      }).then(restore);
    }

    function renderTable() {
      const body = document.getElementById('recordsBody');
      body.innerHTML = '';
      document.getElementById('emptyState').style.display = currentRecords.length === 0 ? 'block' : 'none';
      currentRecords.forEach(function (r) {
        const tr = document.createElement('tr');
        tr.dataset.recordId = r['RecordID'];
        tr.innerHTML =
          '<td>' + r['Date'] + '</td>' +
          '<td>' + r['DispatchNo'] + '</td>' +
          '<td>' + r['Project'] + '</td>' +
          '<td>' + r['角色'] + '</td>' +
          '<td>' + r['上班時間'] + '</td>' +
          '<td>' + r['下班時間'] + '</td>' +
          '<td>' + r['加班時數'] + '</td>' +
          '<td>' + r['交通費'] + '</td>' +
          '<td>' + r['住宿費'] + '</td>' +
          '<td>' + Number(r['合計']).toFixed(2) + '</td>' +
          '<td class="row-actions"><button class="editBtn">編輯</button><button class="deleteBtn">刪除</button></td>';
        tr.querySelector('.editBtn').addEventListener('click', function () { showEditForm(tr, r); });
        tr.querySelector('.deleteBtn').addEventListener('click', function (evt) { deleteRecord(r, evt.target); });
        body.appendChild(tr);
      });
    }

    function showEditForm(tr, record) {
      const editRow = document.createElement('tr');
      editRow.innerHTML =
        '<td colspan="11" class="edit-form">' +
        '<label>交通費</label><input type="number" class="editTransport" value="' + record['交通費'] + '">' +
        '<label>住宿費</label><input type="number" class="editLodging" value="' + record['住宿費'] + '">' +
        '<label>加班時數</label><input type="number" class="editOvertime" value="' + record['加班時數'] + '">' +
        '<button class="saveBtn">儲存</button>' +
        '</td>';
      tr.parentNode.insertBefore(editRow, tr.nextSibling);
      editRow.querySelector('.saveBtn').addEventListener('click', function (evt) {
        const edits = {
          transportation: Number(editRow.querySelector('.editTransport').value),
          lodging: Number(editRow.querySelector('.editLodging').value),
          overtimeHours: Number(editRow.querySelector('.editOvertime').value)
        };
        saveEdit(record, edits, editRow, evt.target);
      });
    }

    function saveEdit(record, edits, editRow, btn) {
      const restore = setBtnLoading(btn, '儲存中…');
      const name = document.getElementById('engineerSelect').value;
      callApi('updateMyRecord', { project: project, name: name, recordId: record['RecordID'], edits: edits }).then(function (res) {
        if (res.ok) {
          editRow.remove();
          search();
        } else if (res.needsConfirmation) {
          alert('工時計算為 ' + res.hours + ' 小時，通常應為 4 或 8 小時，請確認時間後再試一次。');
        } else {
          alert('儲存失敗：' + res.error);
        }
      }).catch(function (err) {
        alert('連線異常，請稍後再試一次：' + err.message);
      }).then(restore);
    }

    function deleteRecord(record, btn) {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;
      const restore = setBtnLoading(btn, '刪除中…');
      const name = document.getElementById('engineerSelect').value;
      callApi('deleteMyRecord', { project: project, name: name, recordId: record['RecordID'] }).then(function (res) {
        if (res.ok) {
          search();
        } else {
          alert('刪除失敗：' + res.error);
        }
      }).catch(function (err) {
        alert('連線異常，請稍後再試一次：' + err.message);
      }).then(restore);
    }
  </script>
</body>
</html>
