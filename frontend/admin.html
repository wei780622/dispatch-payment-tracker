<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台</title>
<style>
  body { font-family: -apple-system, "PingFang TC", sans-serif; background: #f5f5f7; margin: 0; padding: 24px 16px; }
  .card { max-width: 960px; margin: 0 auto 24px; background: #fff; border-radius: 14px; padding: 24px; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; border-top: 1px solid #eee; padding-top: 16px; margin-top: 24px; }
  label { display: inline-block; margin-right: 12px; font-weight: 600; }
  input, select { padding: 6px; border-radius: 8px; border: 1px solid #ccc; margin-right: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { border-bottom: 1px solid #eee; padding: 6px; text-align: left; font-size: 13px; }
  #loginGate { max-width: 320px; margin: 80px auto; text-align: center; }
</style>
</head>
<body>
  <div id="loginGate">
    <h1>管理後台登入</h1>
    <input type="password" id="pinInput" placeholder="請輸入管理密碼">
    <button id="loginBtn">登入</button>
  </div>

  <div id="adminContent" style="display:none;">
    <div class="card">
      <h1>紀錄管理</h1>
      <label>專案</label>
      <select id="recProject"><option value="SDI">SDI</option><option value="HDC">HDC</option></select>
      <label>年月</label>
      <input type="month" id="recYearMonth">
      <label>姓名</label>
      <input type="text" id="recName" placeholder="留空查全部">
      <label><input type="checkbox" id="recIncludeDeleted"> 顯示已刪除</label>
      <button id="recSearchBtn">查詢</button>

      <table id="recTable">
        <thead>
          <tr><th>日期</th><th>類型</th><th>DispatchNo</th><th>Project</th><th>姓名</th><th>單價</th><th>交通費</th><th>住宿費</th><th>合計</th><th>狀態</th><th>發票</th><th></th></tr>
        </thead>
        <tbody id="recBody"></tbody>
      </table>
      <input type="file" id="invoiceFileInput" multiple accept="image/*,.pdf" style="display:none;">
    </div>

    <div class="card">
      <h1>新增固定費用</h1>
      <label>專案</label>
      <select id="feeProject"><option value="SDI">SDI</option><option value="HDC">HDC</option></select>
      <label>日期</label>
      <input type="date" id="feeDate">
      <label>說明</label>
      <select id="feeDescriptionSelect">
        <option value="Warehouse fee(Taipei)">Warehouse fee(Taipei)</option>
        <option value="Warehouse fee(Zhongli)">Warehouse fee(Zhongli)</option>
        <option value="Warehouse fee(Longjing)">Warehouse fee(Longjing)</option>
        <option value="__other__">其他（手動輸入）</option>
      </select>
      <input type="text" id="feeDescriptionOther" placeholder="請輸入說明" style="display:none;">
      <label>金額</label>
      <input type="number" id="feeAmount">
      <button id="feeAddBtn">新增</button>
    </div>

    <div class="card">
      <h1>工程師名單</h1>
      <select id="engProject"><option value="SDI">SDI</option><option value="HDC">HDC</option></select>
      <button id="engRefreshBtn">重新整理</button>
      <input type="text" id="engNewName" placeholder="新增姓名">
      <button id="engAddBtn">新增</button>
      <table id="engTable"><tbody id="engBody"></tbody></table>
    </div>

    <div class="card">
      <h1>案場名單</h1>
      <select id="siteProject"><option value="SDI">SDI</option><option value="HDC">HDC</option></select>
      <button id="siteRefreshBtn">重新整理</button>
      <input type="text" id="siteNewName" placeholder="案場名稱">
      <input type="text" id="siteNewAddress" placeholder="地址">
      <input type="text" id="siteNewChineseName" placeholder="中文名稱（選填）">
      <button id="siteAddBtn">新增</button>
      <table id="siteTable">
        <thead>
          <tr><th>案場名稱</th><th>地址</th><th>中文名稱</th><th>狀態</th><th></th></tr>
        </thead>
        <tbody id="siteBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h1>單價設定</h1>
      <div id="settingsForm"></div>
      <button id="settingsSaveBtn">儲存設定</button>
    </div>

    <div class="card">
      <h1>月結算 Excel 匯出</h1>
      <label>專案</label>
      <select id="exportProject"><option value="SDI">SDI</option><option value="HDC">HDC</option></select>
      <label>年月</label>
      <input type="month" id="exportYearMonth">
      <label>美金匯率</label>
      <input type="number" id="exportRate" step="0.01">
      <button id="exportBtn">產生 Excel</button>
      <button id="routeListBtn">產生路線清單</button>
      <table id="routeListTable" style="display:none;">
        <thead>
          <tr><th></th><th>DispatchNo</th><th>日期</th><th>姓名</th><th>案場</th></tr>
        </thead>
        <tbody id="routeListBody"></tbody>
      </table>
      <button id="routeListDownloadBtn" style="display:none;">下載勾選項目</button>
      <button id="invoiceListBtn">產生發票清單</button>
      <table id="invoiceListTable" style="display:none;">
        <thead>
          <tr><th></th><th>DispatchNo</th><th>日期</th><th>姓名</th><th>發票數量</th></tr>
        </thead>
        <tbody id="invoiceListBody"></tbody>
      </table>
      <button id="invoiceListDownloadBtn" style="display:none;">下載勾選項目</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="adminShared.js"></script>
  <script>
    let currentRecords = [];
    let currentSettings = null;

    function refreshSettings() {
      adminCallApi('adminGetSettings', {}).then(function (res) {
        if (!res.ok) { alert('讀取設定失敗：' + res.error); return; }
        currentSettings = res.settings;
        const container = document.getElementById('settingsForm');
        container.innerHTML = '';
        ['SDI', 'HDC'].forEach(function (project) {
          const div = document.createElement('div');
          div.innerHTML =
            '<strong>' + project + '</strong> ' +
            '前綴 <input type="text" id="prefix_' + project + '" value="' + currentSettings[project].prefix + '"> ' +
            'Engineer <input type="number" id="eng_' + project + '" value="' + currentSettings[project].rates.Engineer + '"> ' +
            'Worker <input type="number" id="worker_' + project + '" value="' + currentSettings[project].rates.Worker + '">';
          container.appendChild(div);
        });
      }).catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }

    document.getElementById('settingsSaveBtn').addEventListener('click', function () {
      const settings = {
        SDI: {
          prefix: document.getElementById('prefix_SDI').value,
          rates: { Engineer: Number(document.getElementById('eng_SDI').value), Worker: Number(document.getElementById('worker_SDI').value) }
        },
        HDC: {
          prefix: document.getElementById('prefix_HDC').value,
          rates: { Engineer: Number(document.getElementById('eng_HDC').value), Worker: Number(document.getElementById('worker_HDC').value) }
        }
      };
      adminCallApi('adminUpdateSettings', { settings: settings })
        .then(function (res) { alert(res.ok ? '已儲存' : '儲存失敗：' + res.error); })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    });

    document.getElementById('exportBtn').addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      adminCallApi('exportMonthlyExcel', {
        project: document.getElementById('exportProject').value,
        yearMonth: document.getElementById('exportYearMonth').value,
        exchangeRate: Number(document.getElementById('exportRate').value)
      }).then(function (res) {
        btn.disabled = false;
        if (!res.ok) { alert('匯出失敗：' + res.error); return; }
        const byteChars = atob(res.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = res.filename;
        a.click();
        URL.revokeObjectURL(url);
      }).catch(function (err) {
        btn.disabled = false;
        alert('連線異常，請稍後再試一次：' + err.message);
      });
    });

    let currentRoutes = [];

    document.getElementById('routeListBtn').addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      const project = document.getElementById('exportProject').value;
      const yearMonth = document.getElementById('exportYearMonth').value;
      adminCallApi('adminExportRouteList', {
        project: project,
        yearMonth: yearMonth
      }).then(function (res) {
        btn.disabled = false;
        if (!res.ok) { alert('匯出失敗：' + res.error); return; }
        currentRoutes = res.routes || [];
        renderRouteListTable();
      }).catch(function (err) {
        btn.disabled = false;
        alert('連線異常，請稍後再試一次：' + err.message);
      });
    });

    function renderRouteListTable() {
      const table = document.getElementById('routeListTable');
      const downloadBtn = document.getElementById('routeListDownloadBtn');
      const body = document.getElementById('routeListBody');
      body.innerHTML = '';
      if (currentRoutes.length === 0) {
        table.style.display = 'none';
        downloadBtn.style.display = 'none';
        alert('這個月沒有派工紀錄');
        return;
      }
      currentRoutes.forEach(function (route, index) {
        const tr = document.createElement('tr');
        const checkboxTd = document.createElement('td');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.dataset.index = index;
        checkboxTd.appendChild(checkbox);
        tr.appendChild(checkboxTd);
        [route.dispatchNo, route.date, route.name, route.siteName].forEach(function (value) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      table.style.display = 'table';
      downloadBtn.style.display = 'inline-block';
    }

    document.getElementById('routeListDownloadBtn').addEventListener('click', function () {
      const project = document.getElementById('exportProject').value;
      const yearMonth = document.getElementById('exportYearMonth').value;
      const checkboxes = document.querySelectorAll('#routeListBody input[type="checkbox"]');
      const selected = Array.from(checkboxes)
        .filter(function (cb) { return cb.checked; })
        .map(function (cb) { return currentRoutes[Number(cb.dataset.index)]; });
      if (selected.length === 0) { alert('請至少勾選一筆'); return; }
      const blob = new Blob([JSON.stringify(selected, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'routes_' + project + '_' + yearMonth + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    let currentInvoices = [];

    document.getElementById('invoiceListBtn').addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      const project = document.getElementById('exportProject').value;
      const yearMonth = document.getElementById('exportYearMonth').value;
      adminCallApi('adminExportInvoiceList', {
        project: project,
        yearMonth: yearMonth
      }).then(function (res) {
        btn.disabled = false;
        if (!res.ok) { alert('匯出失敗：' + res.error); return; }
        currentInvoices = res.invoices || [];
        renderInvoiceListTable();
      }).catch(function (err) {
        btn.disabled = false;
        alert('連線異常，請稍後再試一次：' + err.message);
      });
    });

    function renderInvoiceListTable() {
      const table = document.getElementById('invoiceListTable');
      const downloadBtn = document.getElementById('invoiceListDownloadBtn');
      const body = document.getElementById('invoiceListBody');
      body.innerHTML = '';
      if (currentInvoices.length === 0) {
        table.style.display = 'none';
        downloadBtn.style.display = 'none';
        alert('這個月沒有上傳發票的紀錄');
        return;
      }
      currentInvoices.forEach(function (invoice, index) {
        const tr = document.createElement('tr');
        const checkboxTd = document.createElement('td');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.dataset.index = index;
        checkboxTd.appendChild(checkbox);
        tr.appendChild(checkboxTd);
        [invoice.dispatchNo, invoice.date, invoice.name, invoice.invoiceUrls.length].forEach(function (value) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      table.style.display = 'table';
      downloadBtn.style.display = 'inline-block';
    }

    document.getElementById('invoiceListDownloadBtn').addEventListener('click', function () {
      const project = document.getElementById('exportProject').value;
      const yearMonth = document.getElementById('exportYearMonth').value;
      const checkboxes = document.querySelectorAll('#invoiceListBody input[type="checkbox"]');
      const selected = Array.from(checkboxes)
        .filter(function (cb) { return cb.checked; })
        .map(function (cb) { return currentInvoices[Number(cb.dataset.index)]; });
      if (selected.length === 0) { alert('請至少勾選一筆'); return; }
      const blob = new Blob([JSON.stringify(selected, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'invoices_' + project + '_' + yearMonth + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.addEventListener('DOMContentLoaded', function () {
      if (getAdminPin()) {
        showAdminContent();
      }
      document.getElementById('loginBtn').addEventListener('click', function () {
        setAdminPin(document.getElementById('pinInput').value);
        showAdminContent();
      });
      document.getElementById('recSearchBtn').addEventListener('click', searchRecords);

      const now = new Date();
      document.getElementById('recYearMonth').value =
        now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    });

    function showAdminContent() {
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      searchRecords();
      refreshEngineers();
      refreshSites();
      refreshSettings();
    }

    function searchRecords() {
      const project = document.getElementById('recProject').value;
      const yearMonth = document.getElementById('recYearMonth').value;
      const name = document.getElementById('recName').value;
      const includeDeleted = document.getElementById('recIncludeDeleted').checked;
      adminCallApi('adminGetRecords', { project: project, yearMonth: yearMonth, name: name, includeDeleted: includeDeleted })
        .then(function (res) {
          if (!res.ok) { alert('查詢失敗：' + res.error); return; }
          currentRecords = res.records || [];
          renderRecordTable();
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }

    function renderRecordTable() {
      const body = document.getElementById('recBody');
      body.innerHTML = '';
      currentRecords.forEach(function (r) {
        const tr = document.createElement('tr');
        const cells = [r['Date'], r['類型'], r['DispatchNo'], r['Project'], r['姓名'], r['單價'], r['交通費'], r['住宿費'], r['合計'], r['狀態']];
        cells.forEach(function (value) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        });
        const invoiceTd = document.createElement('td');
        const invoiceUrls = (r['發票'] || '').split(' | ').filter(Boolean);
        invoiceUrls.forEach(function (url, i) {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.textContent = '發票' + (i + 1);
          a.style.marginRight = '6px';
          invoiceTd.appendChild(a);
        });
        if (invoiceUrls.length === 0) invoiceTd.textContent = '-';
        tr.appendChild(invoiceTd);
        const actionTd = document.createElement('td');
        const editBtn = document.createElement('button');
        editBtn.textContent = '編輯';
        editBtn.addEventListener('click', function () { showEditForm(tr, r); });
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '刪除';
        deleteBtn.addEventListener('click', function () { deleteRecord(r); });
        const uploadBtn = document.createElement('button');
        uploadBtn.textContent = '上傳發票';
        uploadBtn.addEventListener('click', function () { startInvoiceUpload(r); });
        actionTd.appendChild(editBtn);
        actionTd.appendChild(deleteBtn);
        actionTd.appendChild(uploadBtn);
        tr.appendChild(actionTd);
        body.appendChild(tr);
      });
    }

    let pendingInvoiceRecord = null;

    function startInvoiceUpload(record) {
      pendingInvoiceRecord = record;
      document.getElementById('invoiceFileInput').click();
    }

    function fileToBase64(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('invoiceFileInput').addEventListener('change', function () {
      const files = Array.from(this.files);
      this.value = '';
      if (files.length === 0 || !pendingInvoiceRecord) return;
      const project = document.getElementById('recProject').value;
      const recordId = pendingInvoiceRecord['RecordID'];
      let chain = Promise.resolve();
      files.forEach(function (file) {
        chain = chain.then(function () {
          return fileToBase64(file).then(function (base64) {
            return adminCallApi('adminUploadInvoice', {
              project: project,
              recordId: recordId,
              filename: file.name,
              mimeType: file.type || 'application/octet-stream',
              base64: base64
            });
          });
        });
      });
      chain.then(function (lastRes) {
        if (lastRes && !lastRes.ok) { alert('上傳失敗：' + lastRes.error); }
        pendingInvoiceRecord = null;
        searchRecords();
      }).catch(function (err) {
        pendingInvoiceRecord = null;
        alert('連線異常，請稍後再試一次：' + err.message);
      });
    });

    function showEditForm(tr, record) {
      const editRow = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 12;
      const isFee = record['類型'] === '固定費用';
      const fields = isFee ? [
        { key: 'date', label: '日期', value: record['Date'] },
        { key: 'description', label: '說明', value: record['姓名'] },
        { key: 'amount', label: '金額', value: record['合計'] }
      ] : [
        { key: 'date', label: '日期', value: record['Date'] },
        { key: 'dispatchNo', label: 'DispatchNo', value: record['DispatchNo'] },
        { key: 'project', label: 'Project', value: record['Project'] },
        { key: 'role', label: '角色', value: record['角色'] },
        { key: 'unitPrice', label: '單價', value: record['單價'] },
        { key: 'transportation', label: '交通費', value: record['交通費'] },
        { key: 'kilometers', label: '公里數', value: record['公里數'] || 0 },
        { key: 'lodging', label: '住宿費', value: record['住宿費'] },
        { key: 'overtimeHours', label: '加班時數', value: record['加班時數'] }
      ];
      const inputs = {};
      fields.forEach(function (f) {
        const label = document.createElement('label');
        label.textContent = f.label;
        const input = document.createElement('input');
        input.value = f.value;
        inputs[f.key] = input;
        td.appendChild(label);
        td.appendChild(input);
      });
      const saveBtn = document.createElement('button');
      saveBtn.textContent = '儲存';
      saveBtn.addEventListener('click', function () {
        const edits = isFee ? {
          date: inputs.date.value,
          description: inputs.description.value,
          amount: Number(inputs.amount.value)
        } : {
          date: inputs.date.value,
          dispatchNo: inputs.dispatchNo.value,
          project: inputs.project.value,
          role: inputs.role.value,
          unitPrice: Number(inputs.unitPrice.value),
          transportation: Number(inputs.transportation.value),
          kilometers: Number(inputs.kilometers.value),
          lodging: Number(inputs.lodging.value),
          overtimeHours: Number(inputs.overtimeHours.value)
        };
        saveRecordEdit(record, edits, editRow);
      });
      td.appendChild(saveBtn);
      editRow.appendChild(td);
      tr.parentNode.insertBefore(editRow, tr.nextSibling);
    }

    function saveRecordEdit(record, edits, editRow) {
      const project = document.getElementById('recProject').value;
      adminCallApi('adminUpdateRecord', { project: project, recordId: record['RecordID'], edits: edits })
        .then(function (res) {
          if (res.ok) {
            editRow.remove();
            searchRecords();
          } else if (res.needsConfirmation) {
            if (confirm('工時計算為 ' + res.hours + ' 小時，通常應為 4 或 8 小時，是否仍要送出？')) {
              edits.forceSubmit = true;
              saveRecordEdit(record, edits, editRow);
            }
          } else {
            alert('儲存失敗：' + res.error);
          }
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }

    function deleteRecord(record) {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;
      const project = document.getElementById('recProject').value;
      adminCallApi('adminDeleteRecord', { project: project, recordId: record['RecordID'] })
        .then(function (res) {
          if (res.ok) { searchRecords(); } else { alert('刪除失敗：' + res.error); }
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }

    document.getElementById('feeDescriptionSelect').addEventListener('change', function () {
      document.getElementById('feeDescriptionOther').style.display = this.value === '__other__' ? 'block' : 'none';
    });

    document.getElementById('feeAddBtn').addEventListener('click', function () {
      const descSelect = document.getElementById('feeDescriptionSelect');
      const description = descSelect.value === '__other__'
        ? document.getElementById('feeDescriptionOther').value
        : descSelect.value;
      const input = {
        date: document.getElementById('feeDate').value,
        description: description,
        amount: Number(document.getElementById('feeAmount').value)
      };
      adminCallApi('adminAddFixedFee', { project: document.getElementById('feeProject').value, input: input })
        .then(function (res) {
          if (res.ok) { alert('已新增'); } else { alert('新增失敗：' + res.error); }
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    });

    document.getElementById('engRefreshBtn').addEventListener('click', refreshEngineers);
    document.getElementById('engAddBtn').addEventListener('click', function () {
      const name = document.getElementById('engNewName').value.trim();
      if (!name) return;
      adminCallApi('adminAddEngineer', { project: document.getElementById('engProject').value, name: name })
        .then(function () { document.getElementById('engNewName').value = ''; refreshEngineers(); })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    });

    function refreshEngineers() {
      adminCallApi('adminGetEngineers', { project: document.getElementById('engProject').value })
        .then(function (res) {
          if (!res.ok) { alert('讀取工程師名單失敗：' + res.error); return; }
          const body = document.getElementById('engBody');
          body.innerHTML = '';
          (res.engineers || []).forEach(function (e) {
            const tr = document.createElement('tr');
            const nameTd = document.createElement('td');
            nameTd.textContent = e.name;
            const toggleTd = document.createElement('td');
            const btn = document.createElement('button');
            btn.textContent = e.active ? '停用' : '啟用';
            btn.addEventListener('click', function () {
              adminCallApi('adminToggleEngineer', { project: document.getElementById('engProject').value, name: e.name, active: !e.active })
                .then(refreshEngineers);
            });
            toggleTd.appendChild(btn);
            tr.appendChild(nameTd);
            tr.appendChild(toggleTd);
            body.appendChild(tr);
          });
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }

    document.getElementById('siteRefreshBtn').addEventListener('click', refreshSites);
    document.getElementById('siteAddBtn').addEventListener('click', function () {
      const name = document.getElementById('siteNewName').value.trim();
      const address = document.getElementById('siteNewAddress').value.trim();
      const chineseName = document.getElementById('siteNewChineseName').value.trim();
      if (!name || !address) return;
      adminCallApi('adminAddSite', { project: document.getElementById('siteProject').value, name: name, address: address, chineseName: chineseName })
        .then(function () {
          document.getElementById('siteNewName').value = '';
          document.getElementById('siteNewAddress').value = '';
          document.getElementById('siteNewChineseName').value = '';
          refreshSites();
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    });

    function refreshSites() {
      adminCallApi('adminGetSites', { project: document.getElementById('siteProject').value })
        .then(function (res) {
          if (!res.ok) { alert('讀取案場名單失敗：' + res.error); return; }
          const body = document.getElementById('siteBody');
          body.innerHTML = '';
          (res.sites || []).forEach(function (s) {
            renderSiteRow(s);
          });
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }

    function renderSiteRow(s) {
      const body = document.getElementById('siteBody');
      const tr = document.createElement('tr');
      [s.name, s.address, s.chineseName || '-', s.active ? '啟用中' : '已停用'].forEach(function (value) {
        const td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      });
      const actionTd = document.createElement('td');
      const toggleBtn = document.createElement('button');
      toggleBtn.textContent = s.active ? '停用' : '啟用';
      toggleBtn.addEventListener('click', function () {
        adminCallApi('adminToggleSite', { project: document.getElementById('siteProject').value, name: s.name, active: !s.active })
          .then(refreshSites);
      });
      const editBtn = document.createElement('button');
      editBtn.textContent = '編輯';
      editBtn.addEventListener('click', function () { showSiteEditForm(tr, s); });
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '刪除';
      deleteBtn.addEventListener('click', function () { deleteSite(s); });
      actionTd.appendChild(toggleBtn);
      actionTd.appendChild(editBtn);
      actionTd.appendChild(deleteBtn);
      tr.appendChild(actionTd);
      body.appendChild(tr);
    }

    function showSiteEditForm(tr, site) {
      const editRow = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 5;
      const nameInput = document.createElement('input');
      nameInput.value = site.name;
      const addressInput = document.createElement('input');
      addressInput.value = site.address;
      const chineseNameInput = document.createElement('input');
      chineseNameInput.value = site.chineseName || '';
      [
        ['案場名稱', nameInput],
        ['地址', addressInput],
        ['中文名稱', chineseNameInput]
      ].forEach(function (pair) {
        const label = document.createElement('label');
        label.textContent = pair[0];
        td.appendChild(label);
        td.appendChild(pair[1]);
      });
      const saveBtn = document.createElement('button');
      saveBtn.textContent = '儲存';
      saveBtn.addEventListener('click', function () {
        adminCallApi('adminUpdateSite', {
          project: document.getElementById('siteProject').value,
          name: site.name,
          edits: { name: nameInput.value.trim(), address: addressInput.value.trim(), chineseName: chineseNameInput.value.trim() }
        }).then(function (res) {
          if (res.ok) { refreshSites(); } else { alert('儲存失敗：' + res.error); }
        }).catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', function () { editRow.remove(); });
      td.appendChild(saveBtn);
      td.appendChild(cancelBtn);
      editRow.appendChild(td);
      tr.parentNode.insertBefore(editRow, tr.nextSibling);
    }

    function deleteSite(site) {
      if (!confirm('確定要刪除案場「' + site.name + '」嗎？此動作無法復原（不影響過去已經建立的派工紀錄）。')) return;
      adminCallApi('adminDeleteSite', { project: document.getElementById('siteProject').value, name: site.name })
        .then(function (res) {
          if (res.ok) { refreshSites(); } else { alert('刪除失敗：' + res.error); }
        })
        .catch(function (err) { alert('連線異常，請稍後再試一次：' + err.message); });
    }
  </script>
</body>
</html>
